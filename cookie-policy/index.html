cks.\",\"badge\":\"Classic Mode\"},\"hoopiq\":{\"title\":\"Hoop IQ\",\"description\":\"Stats hidden — draft by memory and test your ball knowledge.\",\"badge\":\"Hoop IQ Mode\"},\"teamDraft\":{\"title\":\"📋 Team Draft\",\"description\":\"Skip roulette — manually pick team and decade each round.\",\"cta\":\"Play Team Draft\"},\"ultimate11\":{\"new\":\"New:\"},\"oneVsOne\":{\"title\":\"1v1\",\"description\":\"Draft your team, then go head-to-head against a rival lineup.\"}},\"greatestTeam\":{\"meta\":{\"title\":\"The Greatest Basketball Team Ever Assembled\",\"description\":\"Build your all-time NBA starting five. Pick from Magic, Jordan, LeBron, Duncan, Kareem and more — then see if your dream team can go 82-0.\"},\"h1\":\"The Greatest Basketball Team Ever Assembled\",\"intro\":[\"Every basketball fan has built this team at least once.\",\"Maybe it starts with Michael Jordan. Maybe it starts with LeBron James. Maybe you're taking Magic Johnson over Stephen Curry, Kareem over Shaq, or Kobe over everyone.\",\"That's the problem. There are too many legends. Too many eras. Too many players who dominated the game in completely different ways. And no matter who you choose, somebody will tell you you're wrong.\",\"That's what makes the debate so much fun.\",\"Below are some of the greatest players ever to play each position. Review the candidates, make your selections, and see whether your dream team has what it takes to complete a perfect 82-0 season.\"],\"candidatesHeader\":\"Candidates\",\"positions\":{\"sectionLabel\":\"Pick one player at each position\",\"pg\":{\"title\":\"Point Guard\",\"subtitle\":\"The player who controls everything\",\"blurb\":\"Every possession starts somewhere. The greatest point guards don't just bring the ball up the floor — they control the pace, create opportunities, and make everyone around them better. Some dominate with vision. Others with shooting. The very best do both.\",\"abbrev\":\"PG\",\"listName\":\"The Greatest Point Guards Ever\"},\"sg\":{\"title\":\"Shooting Guard\",\"subtitle\":\"The bucket getter\",\"blurb\":\"When a game is on the line, somebody has to go get a basket. The greatest shooting guards combine scoring, competitiveness, and the ability to take over when everything else stops working. These are the players nobody wanted to defend in the final minutes.\",\"abbrev\":\"SG\",\"listName\":\"The Greatest Shooting Guards Ever\"},\"sf\":{\"title\":\"Small Forward\",\"subtitle\":\"The complete player\",\"blurb\":\"Score. Pass. Defend. Rebound. Lead. Small forwards are often asked to do a little bit of everything, which is why so many all-time greats played this position.\",\"abbrev\":\"SF\",\"listName\":\"The Greatest Small Forwards Ever\"},\"pf\":{\"title\":\"Power Forward\",\"subtitle\":\"The foundation\",\"blurb\":\"Championship teams are rarely built on highlights alone. The greatest power forwards bring consistency, toughness, leadership, and the ability to impact every part of the game. They may not always grab the headlines — they usually end up holding the trophy.\",\"abbrev\":\"PF\",\"listName\":\"The Greatest Power Forwards Ever\"},\"c\":{\"title\":\"Center\",\"subtitle\":\"The ultimate advantage\",\"blurb\":\"For generations, every great team started with one question: who protects the paint? The greatest centers dominate both ends of the floor, control rebounds, alter shots, and force opponents to completely change how they play. Some won with skill. Some won with power. All of them changed the game.\",\"abbrev\":\"C\",\"listName\":\"The Greatest Centers Ever\"}},\"yourFive\":{\"title\":\"Your Greatest Five\",\"empty\":\"Pick one player at each position above to build your starting five.\",\"reset\":\"Reset picks\"},\"ourFive\":{\"title\":\"Our Greatest Starting Five\",\"outro\":\"Would this team go 82-0? Maybe. But we're willing to bet your version looks different.\"},\"noPerfectAnswer\":{\"title\":\"There Is No Perfect Answer\",\"body\":[\"Ask ten basketball fans for the greatest team ever assembled and you'll get ten different lineups.\",\"Some value championships. Others value peak performance. Some build around scoring. Others build around defense. Some trust modern stars. Others believe the legends of previous generations would dominate any era.\",\"That's exactly why 82-0 exists. Because talking about the greatest team ever is fun. Finding out how that team actually performs is even better.\"]},\"faq\":{\"title\":\"Frequently Asked Questions\",\"items\":[{\"q\":\"Who is the greatest basketball player of all time?\",\"a\":\"Michael Jordan and LeBron James are the two players most commonly placed at the top of all-time rankings.\"},{\"q\":\"Who has won the most championships?\",\"a\":\"Bill Russell won 11 professional basketball championships.\"},{\"q\":\"What is the greatest starting five ever?\",\"a\":\"Many fans choose Magic Johnson, Michael Jordan, LeBron James, Tim Duncan and Kareem Abdul-Jabbar.\"},{\"q\":\"Who is the greatest center ever?\",\"a\":\"The debate usually includes Kareem Abdul-Jabbar, Wilt Chamberlain, Bill Russell, Shaquille O'Neal and Nikola Jokić.\"}]},\"cta\":{\"title\":\"Build Your Dream Team\",\"body\":[\"Draft legendary players from every era. Create your all-time starting five. Simulate an entire season. See if your team can achieve perfection.\",\"Because everybody has a greatest team. Very few can prove it.\"],\"button\":\"Play 82-0\"}},\"home\":{\"headlineQuestion\":\"Can you go 82-0?\",\"logoAlt\":\"82-0 Logo\",\"logoAriaLabel\":\"82-0 home\",\"themeToggleAria\":\"Toggle theme\",\"loadingData\":\"Loading data...\",\"respinLoading\":\"Respinning...\",\"logoConfirmTitle\":\"Return to Mode Selection?\",\"logoConfirmDescription\":\"Your current progress will be lost.\",\"logoConfirmAction\":\"Leave game\",\"challengeBannerTitle\":\"Challenge Your Friends\",\"challengeBannerTitleShort\":\"Challenges\",\"challengeBannerCta\":\"Create a Link\",\"challengeBannerCtaShort\":\"Create\"},\"instructions\":{\"titl :\"Rim protection and defensive stops.\",\"aggregationFooter\":\"Your team's Strength Rating is a cumulative total of these categories across all roster spots.\",\"simulationTitle\":\"3. The 82-Game Simulation\",\"simulationIntro\":\"Once the draft is finalized, the engine runs your aggregate stats through a win-projection curve.\",\"simulationCurveLabel\":\"The Curve:\",\"simulationCurveBody\":\"The relationship between stats and wins is not linear. As your team strength increases, each additional win becomes significantly harder to earn.\",\"simulationThresholdLabel\":\"The Threshold:\",\"simulationThresholdBody\":\"To reach the elusive 82-0 record, your roster must maximize cumulative output across all five statistical categories simultaneously. A deficiency in even one category can prevent a perfect season, regardless of how high your scoring might be.\",\"strategyTitle\":\"4. Strategic Approach\",\"strategyTotalsLabel\":\"Maximized Totals:\",\"strategyTotalsBody\":\"Since there are no positional restrictions or synergy penalties, the optimal strategy focuses on identifying the highest raw statistical producers in each era slot.\",\"strategySkipLabel\":\"The Skip:\",\"strategySkipBody\":\"You have one team skip and one decade skip per game. Use them strategically — save them for rounds where the slot machine lands on a weak era or franchise for your strategy.\",\"slotMachineTitle\":\"5. The Slot Machine\",\"slotMachineBody\":\"Each round begins with a slot machine that randomly assigns a team and decade combination. You then select the best available player from that team in that era. The game consists of five rounds — one for each roster position.\",\"modesTitle\":\"Game Modes\",\"modeClassicLabel\":\"Classic\",\"modeClassicBody\":\"Full player stats are visible. Make informed picks based on box score numbers.\",\"modeHoopIqLabel\":\"HoopIQ\",\"modeHoopIqBody\":\"Stats are hidden. Draft entirely from memory and basketball knowledge.\"},\"welcomeTnc\":{\"title\"
